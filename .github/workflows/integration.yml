---
name: "Integration Tests"

# These create real servers in a real Hetzner Cloud project, so they never run
# on a pull request: secrets are not available to forks, and every run costs
# money. Maintainers trigger them by hand, and they run weekly against main so
# that a Hetzner-side change -- a retired image slug, a server type that stopped
# being sold in a location -- is noticed before a release rather than by a user.
"on":
  workflow_dispatch:
    inputs:
      suites:
        description: "Regexp of suites to run, e.g. 'default|arm64'. Empty runs all of them."
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * 1"

# A Hetzner project has a finite server limit. Two runs at once can exhaust it
# and fail both, so let an in-flight run finish rather than cancelling it.
concurrency:
  group: hetzner-integration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      KITCHEN_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Without this the run fails seven times over with an HTTP 401 and no
      # indication that the secret is simply missing.
      - name: Check the API token is available
        run: |
          if [ -z "${HCLOUD_TOKEN}" ]; then
            echo "::error::The HCLOUD_TOKEN repository secret is not set. See integration/README.md."
            exit 1
          fi

      - name: Run the integration suites
        working-directory: integration
        run: bundle exec kitchen test ${{ github.event.inputs.suites }} --concurrency 4

      # Runs whatever happened above. A suite that leaks servers on failure
      # turns a red build into a recurring bill.
      - name: Destroy everything
        if: always()
        working-directory: integration
        run: bundle exec kitchen destroy --concurrency 4

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-logs
          path: integration/.kitchen/logs/
          retention-days: 7

      # Belt and braces: if destroy could not run, say so loudly rather than
      # leaving servers to be found on the next invoice.
      - name: Warn about anything left behind
        if: failure()
        run: |
          echo "::warning::If 'Destroy everything' did not succeed, look for servers labelled run-id=${KITCHEN_RUN_ID}: hcloud server list -l run-id=${KITCHEN_RUN_ID}"
